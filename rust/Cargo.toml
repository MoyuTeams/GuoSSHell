[package]
name = "rshell-m0"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# M0 的编译-链接探针 crate，现为**根 workspace 的成员**（../Cargo.toml）。
# 上游内核不在本仓库里 —— 它是官方仓库、pin 住 rev 的 git 依赖；
# `native/hub`（rinf 信号层）通过本 crate 的 `pub use` 再导出拿类型，
# 所以**上游 rev 只在这里 pin 这一处**。来源、接口与许可见 UPSTREAM.md。

[lib]
name = "rshell_m0"
# crate-type 用默认的 `lib`（rlib）即可：staticlib/cdylib 是 M0b 壳时代
# （已退役）的产物，作为 path 依赖时下游只用 rlib。

# 上游直接引用其仓库内的 portable-pty-psmux，Cargo 会从同一 git rev 解析它。
# 本 workspace 不需要额外配置 `[patch.crates-io]`。Windows 专用修改不参与
# iOS / macOS 编译；许可与补丁说明见 LICENSES/。

[target.'cfg(target_os = "ios")'.dependencies]
# keyring 4.1.5 的 v1 feature 在 iOS 上只启用 apple-native-keyring-store/keychain，
# 而 iOS 没有 legacy keychain，只有 protected data store，缺这个 feature 会直接：
#   error: The `protected` feature is required on iOS
#
# 关键点：**不需要改上游的 Cargo.toml**。Cargo 的 feature 是按包统一(unification)
# 的 —— 只要我们的依赖图里有人打开 `protected`，rshell-storage 那条路径也会看到它。
apple-native-keyring-store = { version = "1.0.1", features = ["protected"] }
# keyring v1 在 iOS 上不注册任何存储：启动时由 `register_credential_store` 把
# protected 存储设为默认（keyring-core 与 keyring 4.1.5 用的是同一个版本）。
keyring-core = "1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "=1.0.0"
keyring-core = "1.0.0"

[dependencies]
# 上游内核走 **git 依赖**，精确 pin 到一个 commit，而不是把源码 vendor 进本仓库。
# 源为官方 hugefiver/rsHell，所需认证、连接控制与终端接口均已包含在上游。
# 升级时同时更新这里的 rev 与根 Cargo.lock，再跑上游及 GuoSSHell 的回归。
# 代价：全新环境首次构建需要网络。
rshell-core = { git = "https://github.com/hugefiver/rsHell", rev = "718d9b62a8f062af8f5787b5fc27f6c5bbb4f268" }
rshell-session = { git = "https://github.com/hugefiver/rsHell", rev = "718d9b62a8f062af8f5787b5fc27f6c5bbb4f268" }
rshell-storage = { git = "https://github.com/hugefiver/rsHell", rev = "718d9b62a8f062af8f5787b5fc27f6c5bbb4f268" }
# 与 rshell-session 保持完全相同的版本与 feature，避免同一个 crate 出现两份不同类型。
russh = { version = "=0.62.5", default-features = false, features = ["flate2", "ring", "rsa"] }
secrecy = "0.10.3"
# RenderFrame 的 rows/cells 是 Arc<[..]>，serde 必须显式打开 rc 才能序列化。
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
# rinf v8 的默认序列化格式，用它量边界上的真实字节数与编码耗时。
bincode = { version = "2", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "net", "process", "io-util"] }

# 只给 examples（m0_loopback / demo_server）用，不进 App 依赖图。
[dev-dependencies]
bytes = "1"
